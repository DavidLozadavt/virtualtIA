# Conversaciones INDEPENDIENTES de la fase 4 (refinar lo mostrado y reservas).
# Escritas al cerrar la fase con frases que no se usaron al desarrollar, y
# corridas UNA sola vez. Mismo formato que dialogos_fase3.yaml.
# Expectativas corregidas tras la primera corrida SOLO en su forma: el evaluador
# compara sin tildes ni mayúsculas, y 'no_booking' no aplica a turnos en que el
# usuario pidió la cita. Resultado de la primera corrida: 5/12 (ver informe fase 4).

- id: f01_entre_todos_el_mas_economico
  turns:
    - say: "muéstrame restaurantes"
    - say: "entre todos esos, ¿cuál sale más económico?"
      no_booking: true
      reply_re: "economico"
      reply_not_re: "No encontré"

- id: f02_alguno_con_parqueadero
  turns:
    - say: "busca restaurantes"
    - say: "de esos, ¿alguno tiene parqueadero?"
      no_booking: true
      reply_re: "registrad"

- id: f03_de_las_que_mostraste_recomienda
  turns:
