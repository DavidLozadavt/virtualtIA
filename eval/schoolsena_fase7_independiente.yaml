# SchoolSena — conjunto INDEPENDIENTE de la fase 7 (formularios y eventos, varios turnos).
# Frases que NO se usaron al desarrollar. Se corre contra los servicios locales reales
# (scripts/eval_school_fase7.py). `expect` = resultado(s) aceptables del turno (school_outcome).
# Fixtures que crea el runner: eventos "Congreso F7IND", "Expo F7IND" (dos, distinta fecha),
# "Cine foro F7IND" (mañana) y el formulario "Registro congreso F7IND" (borrador, 2 preguntas).

- id: i01
  role: admin
  turns:
    - {say: "necesito crear un formulario nuevo", expect: create_flow}
    - {say: "ponle de nombre Inscripción Feria F7IND", expect: form_prepared}
    - {say: "va a pedir nombres, apellidos, cédula y celular", expect: form_edit}
    - {say: "todas obligatorias", expect: form_edit}
    - {say: "cómo va quedando?", expect: form_preview}
    - {say: "grábalo", expect: form_saved}
- id: i02
  role: admin
  turns:
    - {say: "quiero crear un formulario", expect: create_flow}
    - {say: "Encuesta cafetería F7IND", expect: form_prepared}
    - {say: "agrega una pregunta: ¿Qué tan rico estuvo el almuerzo? de tipo escala", expect: form_edit}
    - {say: "y otra abierta para sugerencias", expect: form_edit}
    - {say: "elimina la primera", expect: form_edit}
    - {say: "no, mejor devuélvelo como estaba", expect: form_edit}
    - {say: "listo, guárdalo", expect: form_saved}
- id: i03
  role: admin
  turns:
