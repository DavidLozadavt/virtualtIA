# Conversaciones de varios turnos (fase 3). Escritas el 2026-11-17 ANTES de cambiar el código.
# Corre con: python scripts/eval_dialogo.py eval/dialogos_fase3.yaml
#
# Cada turno puede exigir (todas opcionales):
#   intent:        intenciones aceptables (lo que resolvió el interceptor)
#   action:        acciones de pantalla aceptables; "none" = ninguna
#   forbid_action: acciones que NO pueden salir
#   biz_cat:       regex que deben cumplir las categorías de TODOS los negocios mostrados
#   biz_name_not:  regex que no puede cumplir ningún negocio mostrado
#   target_from:   [turno, posición] — la entidad sobre la que se actúa es la de esa posición
#                  en la lista mostrada en ese turno (1-indexado)
#   reply_re / reply_not_re: regex sobre la respuesta (sin tildes, minúsculas)
#   clarify:       true = pregunta breve, sin acción ni negocios
#   no_booking:    true = no puede entrar en flujo de reserva
# Ciudad por defecto: Popayán (no hay clínicas; sí un consultorio médico).
# El dominio médico local: "Salud y Bienestar" y "Consultorios y Centros Médicos".

- id: d01_caso_real_dolor_y_confirmacion
  turns:
    - say: "Busca restaurantes"
      intent: [search_businesses]
      biz_cat: "restaurantes"
    - say: "Recomienda un restaurante que en su menú tenga pescado, me encanta el pescado"
      reply_not_re: "\\b(\\w+) \\1\\b"
      no_booking: true
    - say: "Mira que tengo un dolor de cabeza impresionante"
      action: none
      no_booking: true
      reply_re: "medic|consultori|urgenc|profesional"
    - say: "Sí, por favor"
      no_booking: true
      forbid_action: [navigate]
      biz_cat: "salud|consultori|medic"
      biz_name_not: "optica|fogon|parrilla|sazon"
    - say: "Muéstrame el segundo"
      no_booking: true
      # En Popayán hay un solo centro médico: "el segundo" no existe y se dice.
      clarify: true
      reply_re: "solo te mostre una opcion"
    - say: "Volvamos a los restaurantes"
      no_booking: true
      biz_cat: "restaurantes"
      reply_not_re: "volvamos"

- id: d02_negacion_de_la_oferta
  turns:
    - say: "Muéstrame restaurantes"
      biz_cat: "restaurantes"
    - say: "Me duele mucho la cabeza"
      action: none
      no_booking: true
    - say: "Mejor no"
      action: none
      no_booking: true
    - say: "el primero"
      no_booking: true
      target_from: [1, 1]

- id: d03_si_sin_nada_pendiente
  turns:
    - say: "hola"
    - say: "sí"
      clarify: true
      no_booking: true

- id: d04_recomendacion_no_es_reserva
  turns:
    - say: "busca restaurantes"
    - say: "recomiéndame uno"
      no_booking: true
    - say: "dale"
      no_booking: true
      forbid_action: [navigate]

- id: d05_reserva_que_si_se_pidio
  turns:
    - say: "quiero agendar una cita en Consultorio Médico Vida Sana"
      intent: [request_appointment, get_business_services, navigate_to_company]
    - say: "mañana a las 9 am"
      intent: [request_appointment]

- id: d06_oferta_con_dos_opciones
  turns:
    - say: "Fogón Criollo Norte"
      intent: [navigate_to_company, fly_to_business, search_businesses]
      action: [fly_to_business, navigate]
    - say: "sí"
      clarify: true
      no_booking: true

- id: d07_clinica_es_requisito
  turns:
    - say: "Recomiéndame clínica"
      biz_name_not: "optica|fisioterapia"
      reply_re: "no (tengo|hay|encontre) clinicas"
      no_booking: true

- id: d08_otra_cosa
  turns:
    - say: "busca veterinarias"
    - say: "ahora busca otra cosa"
      clarify: true
      no_booking: true

- id: d09_volver_a_lo_anterior
  turns:
    - say: "busca restaurantes"
      biz_cat: "restaurantes"
    - say: "ahora muéstrame veterinarias"
      biz_cat: "mascotas"
    - say: "volvamos a lo anterior"
      biz_cat: "restaurantes"
      no_booking: true
    - say: "el segundo"
      target_from: [1, 2]
      no_booking: true

- id: d10_alarma_y_confirmacion
  turns:
    - say: "busca restaurantes"
    - say: "el tercero"
      target_from: [1, 3]
    - say: "hace varios días me duele la cabeza muy fuerte"
      action: none
      no_booking: true
      reply_re: "123|urgencias"
    - say: "sí"
      no_booking: true
      biz_cat: "salud|consultori|medic"
      biz_name_not: "optica|fogon|parrilla|sazon"
      reply_re: "123|urgencias"

- id: d11_ordinal_sin_lista
  turns:
    - say: "dame el segundo"
      clarify: true
      no_booking: true

- id: d12_reserva_sobre_la_lista_actual
  turns:
    - say: "busca restaurantes"
    - say: "quiero reservar en el segundo"
      intent: [request_appointment]
      target_from: [1, 2]

- id: d13_no_suelto
  turns:
    - say: "no"
      action: none
      no_booking: true

- id: d14_cambio_de_dominio_cancela_reserva
  turns:
    - say: "quiero agendar en Fogón Criollo Norte"
    - say: "mejor busca veterinarias"
      biz_cat: "mascotas"
      no_booking: true
    - say: "sí"
      no_booking: true
      forbid_action: [navigate]

- id: d15_eso_tras_oferta
  turns:
    - say: "me siento mal, tengo fiebre"
      action: none
      no_booking: true
    - say: "eso"
      biz_cat: "salud|consultori|medic"
      no_booking: true

- id: d16_claro_tras_otra_ciudad
  turns:
    - say: "busca clínicas"
      no_booking: true
    - say: "claro"
      no_booking: true
      biz_name_not: "optica|fisioterapia"

- id: d17_saludo_con_nombre_parecido
  turns:
    - say: "hola vida"
      action: none
      intent: [greeting, conversation, greeting_named]

- id: d18_negocio_inexistente_en_el_mapa
  turns:
    - say: "quiero ver barbería vip en el mapa"
      reply_re: "barberia vip"
      reply_not_re: "registrado \\*\\*vip"
