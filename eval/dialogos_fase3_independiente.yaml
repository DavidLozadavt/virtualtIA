# Conversaciones INDEPENDIENTES (fase 3). Escritas al final de la fase, con frases que no se
# usaron al desarrollar, y corridas UNA sola vez. Mismo formato que dialogos_fase3.yaml.

- id: i01_fiebre_y_dale
  turns:
    - say: "muéstrame peluquerías"
    - say: "uff estoy con fiebre desde ayer"
      action: none
      no_booking: true
    - say: "dale pues"
      no_booking: true
      forbid_action: [navigate]
      biz_name_not: "peluquer|optica|barber"

- id: i02_no_gracias_tras_oferta
  turns:
    - say: "me duele el estómago"
      action: none
    - say: "no gracias"
      action: none
      no_booking: true
    - say: "listo"
      no_booking: true
      forbid_action: [navigate]

- id: i03_ok_sin_propuesta
  turns:
    - say: "busca talleres de mecánica"
    - say: "recomiéndame el mejor"
      no_booking: true
    - say: "ok"
      no_booking: true
      forbid_action: [navigate]

