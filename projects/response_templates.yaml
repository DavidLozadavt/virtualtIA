# ==============================================================================
# Motor de Respuestas de Lyra-AI — Banco de Plantillas v2
# ==============================================================================
# Estructura: personalidad → intent → escenario → lista de variaciones
#
# Variables disponibles (se rellenan automáticamente):
#   {nombre}          — Nombre del negocio
#   {bot_name}        — Nombre del asistente (Lyra/Nexo)
#   {distancia}       — Distancia formateada ("200 metros" / "1.3 km")
#   {direccion}       — Dirección del negocio
#   {categoria}       — Categoría del negocio / búsqueda
#   {cantidad}        — Cantidad de resultados
#   {lista_negocios}  — Lista de negocios con viñetas (autogenerada)
#
# Para agregar variaciones, solo agrega otra línea "- ..." al array.
# El motor selecciona aleatoriamente y evita repetir las últimas 5 respuestas.
# ==============================================================================

lyra:
